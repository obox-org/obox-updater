# obox-updater 扩展发布：obox 打 tag（repository_dispatch）或手动触发时，
# 在 obox-updater 仓库编译 .oix，并跨仓上传到 obox 对应 tag 的 Release。
# 前置：仓库需配置 secret OBX_UPLOAD_TOKEN（对 obox-org/obox 有写权限的 PAT）。
name: Release oix to obox

on:
  repository_dispatch:
    types: [obox-released]
  workflow_dispatch:
    inputs:
      tag:
        description: 'obox release tag（如 v1.0.1）'
        required: true
        default: 'v1.0.1'

permissions:
  contents: read

jobs:
  build-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Test and pack oix
        run: npm run release

      - name: Upload oix to obox release
        env:
          UPLOAD_TOKEN: ${{ secrets.OBX_UPLOAD_TOKEN }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          tag="${TAG:-${{ github.event.inputs.tag }}}"
          if [ -z "$tag" ]; then
            echo "::error::缺少 tag（repository_dispatch client_payload.tag 或 workflow_dispatch 输入）"
            exit 1
          fi
          oix=$(ls out/*.oix | head -n 1)
          if [ -z "$oix" ]; then
            echo "::error::未找到 out/*.oix（npm run pack 未产出）"
            exit 1
          fi
          rel=$(curl -sS -H "Authorization: token ${UPLOAD_TOKEN}" \
            "https://api.github.com/repos/obox-org/obox/releases/tags/${tag}")
          id=$(printf '%s' "$rel" | jq -r .id)
          if [ "$id" = "null" ] || [ -z "$id" ]; then
            echo "::error::obox Release ${tag} 不存在"
            exit 1
          fi
          name=$(basename "$oix")
          curl -sS -X POST \
            -H "Authorization: token ${UPLOAD_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${oix}" \
            "https://uploads.github.com/repos/obox-org/obox/releases/${id}/assets?name=${name}"
          echo "已上传 ${name} 到 obox ${tag} Release"
